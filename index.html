
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mon Budget</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f3f6;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 850px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #222;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card h3 {
    margin: 0;
}

.card p {
    font-size: 24px;
    font-weight: bold;
}

.solde p {
    color: #007bff;
}

.revenus p {
    color: #28a745;
}

.depenses p {
    color: #dc3545;
}

.form,
.operations,
.graphique {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

input,
select,
button {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    font-size: 16px;
    border-radius: 6px;
}

input,
select {
    border: 1px solid #ccc;
}

button {
    border: none;
    background: #28a745;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #28a745;
    color: white;
}

.revenu {
    color: #28a745;
    font-weight: bold;
}

.depense {
    color: #dc3545;
    font-weight: bold;
}

.delete {
    background: #dc3545;
    width: auto;
    padding: 7px 10px;
}

.message {
    text-align: center;
    color: #777;
    padding: 20px;
}

.bar-container {
    margin: 20px 0;
}

.bar-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-weight: bold;
}

.bar {
    width: 100%;
    height: 35px;
    background: #eee;
    border-radius: 8px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    width: 0%;
    transition: width 0.5s;
}

.revenu-bar {
    background: #28a745;
}

.depense-bar {
    background: #dc3545;
}

@media (max-width: 600px) {

    .dashboard {
        grid-template-columns: 1fr;
    }

    table {
        font-size: 13px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>💰 Mon Budget</h1>


<div class="dashboard">

<div class="card solde">
<h3>💰 Solde</h3>
<p id="solde">0.00 €</p>
</div>

<div class="card revenus">
<h3>🟢 Revenus</h3>
<p id="revenus">0.00 €</p>
</div>

<div class="card depenses">
<h3>🔴 Dépenses</h3>
<p id="depenses">0.00 €</p>
</div>

</div>


<div class="form">

<h2>➕ Ajouter une opération</h2>

<input
type="text"
id="description"
placeholder="Description"
>

<input
type="number"
id="montant"
placeholder="Montant en €"
step="0.01"
>

<select id="type">

<option value="revenu">🟢 Revenu</option>

<option value="depense">🔴 Dépense</option>

</select>

<button onclick="ajouter()">
Ajouter
</button>

</div>


<div class="graphique">

<h2>📊 Analyse financière</h2>

<div class="bar-container">

<div class="bar-label">

<span>🟢 Revenus</span>

<span id="revenusGraphique">0 €</span>

</div>

<div class="bar">

<div
id="barRevenus"
class="bar-fill revenu-bar">
</div>

</div>

</div>


<div class="bar-container">

<div class="bar-label">

<span>🔴 Dépenses</span>

<span id="depensesGraphique">0 €</span>

</div>

<div class="bar">

<div
id="barDepenses"
class="bar-fill depense-bar">
</div>

</div>

</div>

</div>


<div class="operations">

<h2>📋 Mes opérations</h2>

<table>

<thead>

<tr>

<th>Description</th>
<th>Montant</th>
<th>Type</th>
<th>Date</th>
<th>Action</th>

</tr>

</thead>

<tbody id="liste"></tbody>

</table>

<div
id="message"
class="message">
Aucune opération pour le moment.
</div>

</div>

</div>


<script>

let operations =
JSON.parse(localStorage.getItem("operations")) || [];


function afficher() {

const liste =
document.getElementById("liste");

const message =
document.getElementById("message");

liste.innerHTML = "";

let totalRevenus = 0;

let totalDepenses = 0;


if (operations.length === 0) {

message.style.display = "block";

} else {

message.style.display = "none";

}


operations.forEach(function(operation, index) {


if (operation.type === "revenu") {

totalRevenus += operation.montant;

} else {

totalDepenses += operation.montant;

}


const ligne =
document.createElement("tr");


ligne.innerHTML = `

<td>
${operation.description}
</td>

<td>
${operation.montant.toFixed(2)} €
</td>

<td class="${operation.type}">
${operation.type === "revenu"
? "Revenu"
: "Dépense"}
</td>

<td>
${operation.date}
</td>

<td>

<button
class="delete"
onclick="supprimer(${index})">
🗑️
</button>

</td>

`;


liste.appendChild(ligne);

});


const solde =
totalRevenus - totalDepenses;


document.getElementById("solde").innerText =
solde.toFixed(2) + " €";


document.getElementById("revenus").innerText =
totalRevenus.toFixed(2) + " €";


document.getElementById("depenses").innerText =
totalDepenses.toFixed(2) + " €";


document.getElementById("revenusGraphique").innerText =
totalRevenus.toFixed(2) + " €";


document.getElementById("depensesGraphique").innerText =
totalDepenses.toFixed(2) + " €";


let maximum =
Math.max(totalRevenus, totalDepenses);


if (maximum === 0) {

document.getElementById("barRevenus").style.width = "0%";

document.getElementById("barDepenses").style.width = "0%";

} else {

document.getElementById("barRevenus").style.width =
(totalRevenus / maximum * 100) + "%";

document.getElementById("barDepenses").style.width =
(totalDepenses / maximum * 100) + "%";

}


sauvegarder();

}


function ajouter() {

const description =
document.getElementById("description").value.trim();

const montant =
parseFloat(
document.getElementById("montant").value
);

const type =
document.getElementById("type").value;


if (
description === "" ||
isNaN(montant) ||
montant <= 0
) {

alert(
"Veuillez remplir correctement les informations."
);

return;

}


const date =
new Date().toLocaleDateString("fr-FR");


operations.push({

description: description,

montant: montant,

type: type,

date: date

});


document.getElementById("description").value = "";

document.getElementById("montant").value = "";


afficher();

}


function supprimer(index) {

if (
!confirm(
"Voulez-vous supprimer cette opération ?"
)
) {

return;

}


operations.splice(index, 1);

afficher();

}


function sauvegarder() {

localStorage.setItem(
"operations",
JSON.stringify(operations)
);

}


afficher();

</script>

</body>

</html>
